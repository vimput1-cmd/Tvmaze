<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVMaze Ultimate - Tugas API</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; color: #333; margin: 0; padding: 20px; }
        .search-bar { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 900px; margin: 0 auto 20px auto; text-align: center; }
        input { padding: 10px; width: 60%; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 10px 20px; background: #3cb878; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2a9d62; }
        
        .container { max-width: 900px; margin: 0 auto; background: transparent; }
        .title { font-size: 36px; font-weight: 300; margin-bottom: 5px; color: #222; }
        
        /* Grid Layout Utama */
        .main-content { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; margin-top: 20px;}
        .poster-col { flex: 0 0 250px; }
        .poster-col img { width: 100%; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        
        .summary-col { flex: 1; min-width: 300px; font-size: 15px; line-height: 1.6; color: #444; }
        .summary-col p { margin-top: 0; }
        
        .info-col { flex: 0 0 250px; background: #fff; padding: 15px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-size: 14px; }
        .info-col h3 { margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px; color: #555; font-weight: 400; font-size: 20px;}
        .info-col p { margin: 8px 0; }
        .info-col strong { color: #222; }
        
        /* Section Episode Selanjutnya */
        .next-episode { margin-top: 30px; background: #fff; padding: 15px; border-radius: 4px; border-left: 5px solid #3cb878; box-shadow: 0 2px 5px rgba(0,0,0,0.05);}
        .next-episode h3 { margin: 0 0 10px 0; font-weight: 400; font-size: 22px; color: #555;}
        
        /* Section Cast */
        .cast-section { margin-top: 30px; }
        .cast-section h3 { font-weight: 400; font-size: 22px; color: #555; border-bottom: 1px solid #ddd; padding-bottom: 10px;}
        .cast-grid { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; }
        .cast-card { background: #fff; width: 120px; flex-shrink: 0; border-radius: 4px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-size: 12px; text-align: center; border: 1px solid #eee;}
        .cast-card img { width: 100%; height: 160px; object-fit: cover; }
        .cast-card .cast-info { padding: 8px; }
        .cast-card strong { display: block; color: #222; font-size: 13px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .cast-card span { color: #777; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        
        ::-webkit-scrollbar { height: 8px; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="search-bar">
        <h2>Pencarian Arsip TV</h2>
        <input type="text" id="showInput" placeholder="Contoh: The Boys, The Last of Us, The Pacific">
        <button onclick="searchShow()">Cari</button>
        <div id="loading" style="display:none; margin-top:15px; color:#666;">Sedang menarik data dari TVMaze...</div>
    </div>

    <div class="container" id="resultData">
        </div>

    <script>
        function searchShow() {
            const showName = document.getElementById('showInput').value.trim();
            const resultDiv = document.getElementById('resultData');
            const loading = document.getElementById('loading');

            if(!showName) {
                alert("Masukkan judul serial terlebih dahulu!");
                return;
            }

            // Tampilkan loading, kosongkan hasil lama
            loading.style.display = 'block';
            resultDiv.innerHTML = '';

            // Memanggil API dengan Multiple Embeds: cast dan nextepisode
            const apiUrl = `https://api.tvmaze.com/singlesearch/shows?q=${showName}&embed[]=cast&embed[]=nextepisode`;

            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Serial tidak ditemukan.');
                    return response.json();
                })
                .then(data => {
                    loading.style.display = 'none'; // Sembunyikan loading

                    // 1. Olah Data Info Utama
                    const imgUrl = data.image ? data.image.original : 'https://via.placeholder.com/250x350?text=No+Poster';
                    const rating = data.rating.average ? data.rating.average : 'N/A';
                    const network = data.network ? data.network.name : (data.webChannel ? data.webChannel.name : 'Unknown');
                    const schedule = data.schedule && data.schedule.days.length > 0 ? `${data.schedule.days.join(', ')} (${data.averageRuntime} min)` : 'TBA';
                    
                    // 2. Olah Data Episode Selanjutnya (Jika ada)
                    let nextEpHTML = '';
                    if (data._embedded && data._embedded.nextepisode) {
                        const nextEp = data._embedded.nextepisode;
                        // Format tanggal (contoh: Apr 15, 2026)
                        const dateObj = new Date(nextEp.airdate);
                        const dateStr = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                        
                        nextEpHTML = `
                            <div class="next-episode">
                                <h3>Next Episode</h3>
                                <strong style="color: #3cb878; font-size: 18px;">${nextEp.name}</strong><br>
                                <span style="color: #666;">Season ${nextEp.season}, Episode ${nextEp.number} | Airing: ${dateStr}</span>
                            </div>
                        `;
                    }

                    // 3. Olah Data Pemeran (Cast) beserta Karakter
                    let castHTML = '';
                    if (data._embedded && data._embedded.cast && data._embedded.cast.length > 0) {
                        data._embedded.cast.forEach(c => {
                            const personImg = c.person.image ? c.person.image.medium : 'https://via.placeholder.com/120x160?text=No+Photo';
                            castHTML += `
                                <div class="cast-card">
                                    <img src="${personImg}" alt="${c.person.name}">
                                    <div class="cast-info">
                                        <strong>${c.person.name}</strong>
                                        <span>sbg ${c.character.name}</span>
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        castHTML = '<p>Data pemeran tidak tersedia.</p>';
                    }

                    // 4. Render semua data ke HTML
                    resultDiv.innerHTML = `
                        <div class="title">${data.name}</div>
                        
                        <div class="main-content">
                            <div class="poster-col">
                                <img src="${imgUrl}" alt="${data.name} Poster">
                            </div>
                            
                            <div class="summary-col">
                                ${data.summary || '<p>Tidak ada sinopsis.</p>'}
                                
                                ${nextEpHTML}
                            </div>
                            
                            <div class="info-col">
                                <h3>Show Info</h3>
                                <p><strong>Network/Web:</strong> <span style="color:#0056b3;">${network}</span></p>
                                <p><strong>Schedule:</strong> ${schedule}</p>
                                <p><strong>Status:</strong> ${data.status}</p>
                                <p><strong>Show Type:</strong> ${data.type}</p>
                                <p><strong>Genres:</strong> ${data.genres.join(' | ')}</p>
                                <p><strong>Rating:</strong> ⭐ <strong style="color:#d9534f;">${rating}</strong></p>
                                <p><strong>Official Site:</strong> <a href="${data.officialSite}" target="_blank" style="color:#0056b3; text-decoration:none;">Visit Site</a></p>
                            </div>
                        </div>

                        <div class="cast-section">
                            <h3>Cast & Characters</h3>
                            <div class="cast-grid">
                                ${castHTML}
                            </div>
                        </div>
                    `;
                })
                .catch(error => {
                    loading.style.display = 'none';
                    resultDiv.innerHTML = `<p style="color:red; text-align:center;">Error: ${error.message}</p>`;
                });
        }
    </script>
</body>
</html>
